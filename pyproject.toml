[project]
name = "itchbook-analysis"
version = "0.1.0"
description = "Reference parser, cross-checks and research analysis for itchbook"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.6"]
# Research analysis (M4 onward): uv run --group analysis tools/queue/analyze.py ...
analysis = ["pandas>=2.2", "numpy>=2.0", "matplotlib>=3.9"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tools/itchref"]
pythonpath = ["tools/itchref"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["itchref", "crosscheck", "bookref", "crosscheck_book", "queue_smoke", "analyze"]
